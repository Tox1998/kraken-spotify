<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Kraken Display Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: #121212; color: white;
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* --- DOBLE CAPA DE FONDO --- */
        .bg-layer {
            position: absolute; top: -20%; left: -20%; width: 140%; height: 140%;
            background-size: cover; background-position: center;
            filter: blur(var(--bg-blur, 45px)) brightness(var(--bg-brightness, 0.4)) saturate(1.5);
            transition: opacity 1.5s ease-in-out;
            opacity: 0; z-index: 1;
        }
        .bg-layer.active { opacity: 1; }

        /* Contenedor principal */
        .content {
            position: relative; z-index: 2;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; 
            gap: var(--element-gap, 6%); 
            width: 100%; height: 100%; padding: 10%; 
        }

        .spotify-logo {
            display: var(--logo-display, block);
            width: var(--logo-size, 90px);
            margin: 0; opacity: 0.9; flex-shrink: 0;
        }

        /* --- DOBLE CAPA DE PORTADA --- */
        .album-wrapper {
            width: var(--album-size, 45%);
            max-width: 65%; aspect-ratio: 1 / 1;
            position: relative;
            border-radius: var(--album-radius, 18px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            flex-shrink: 1; 
            overflow: hidden;
        }
        .album-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            transition: opacity 1s ease-in-out;
            opacity: 0;
        }
        .album-layer.active { opacity: 1; }

        /* --- CONTENEDOR DE TEXTOS --- */
        .text-info {
            width: 72%; /* Muro estricto para evitar cortes curvos sin usar difuminado */
            display: flex; flex-direction: column;
            align-items: center; text-align: center;
            margin: 0; flex-shrink: 0;
        }

        /* Ventana que oculta el texto excedente con corte limpio */
        .text-window {
            width: 100%; position: relative; overflow: hidden;
        }

        .song-title, .song-artist {
            display: inline-block; 
            margin: 0; white-space: nowrap; width: max-content;
            will-change: transform; /* Sincroniza con el GPU para 40Hz perfectos */
        }

        .song-title { font-weight: 700; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .song-artist { font-weight: 400; color: #d1d1d1; margin-top: 6px; }

        /* Animación Ping-Pong Acelerada por Hardware */
        .scrolling-text {
            animation: ping-pong var(--scroll-duration, 4s) ease-in-out infinite alternate;
        }

        @keyframes ping-pong {
            0%, 15% { transform: translate3d(0, 0, 0); } 
            85%, 100% { transform: translate3d(var(--scroll-dist), 0, 0); } 
        }

        /* --- PANTALLA DE CONFIGURACIÓN --- */
        .config-screen {
            position: relative; z-index: 3; width: 100%; max-width: 420px;
            padding: 24px; display: flex; flex-direction: column; gap: 16px;
            font-family: 'Inter', sans-serif; overflow-y: auto; max-height: 100vh;
        }
        .config-screen h2 { margin: 0 0 4px 0; font-size: 1.3rem; }
        .config-row { display: flex; flex-direction: column; gap: 4px; }
        .config-row label { display: flex; justify-content: space-between; font-size: 0.85rem; color: #d1d1d1; }
        .config-row input[type="range"] { width: 100%; }
        .config-row input[type="checkbox"] { width: 18px; height: 18px; }
        .config-reset {
            margin-top: 8px; background: #1DB954; color: black; border: none;
            border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer;
        }
        .config-reset:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="bg-blur-a" class="bg-layer active"></div>
    <div id="bg-blur-b" class="bg-layer"></div>

    <div class="content" id="display-content">
        <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_RGB_White.png" alt="Spotify" class="spotify-logo">
        
        <div class="album-wrapper">
            <div id="album-art-a" class="album-layer active"></div>
            <div id="album-art-b" class="album-layer"></div>
        </div>
        
        <div class="text-info">
            <div class="text-window"><p class="song-title" id="title">Cargando...</p></div>
            <div class="text-window"><p class="song-artist" id="artist">Conectando a Spotify</p></div>
        </div>
    </div>

    <div class="config-screen" id="config-screen" style="display:none;">
        <h2>Ajustes de la pantalla</h2>
        <div class="config-row"><label><span>Tamaño de la portada</span><span id="val-album-size">45%</span></label><input type="range" id="ctrl-album-size" min="20" max="70" value="45"></div>
        <div class="config-row"><label><span>Redondeo de bordes</span><span id="val-album-radius">18px</span></label><input type="range" id="ctrl-album-radius" min="0" max="60" value="18"></div>
        <div class="config-row"><label><span>Espaciado entre elementos</span><span id="val-element-gap">6%</span></label><input type="range" id="ctrl-element-gap" min="0" max="20" value="6"></div>
        <div class="config-row"><label><span>Tamaño del título</span><span id="val-title-size">1.6rem</span></label><input type="range" id="ctrl-title-size" min="10" max="35" value="16"></div>
        <div class="config-row"><label><span>Tamaño del artista</span><span id="val-artist-size">1.1rem</span></label><input type="range" id="ctrl-artist-size" min="8" max="24" value="11"></div>
        <div class="config-row"><label><span>Desenfoque del fondo</span><span id="val-bg-blur">45px</span></label><input type="range" id="ctrl-bg-blur" min="0" max="100" value="45"></div>
        <div class="config-row"><label><span>Brillo del fondo</span><span id="val-bg-brightness">40%</span></label><input type="range" id="ctrl-bg-brightness" min="10" max="100" value="40"></div>
        <div class="config-row" style="flex-direction: row; align-items: center; justify-content: space-between; margin-top: 8px;"><span>Mostrar logo de Spotify</span><input type="checkbox" id="ctrl-logo" checked></div>
        <div class="config-row"><label><span>Tamaño del logo</span><span id="val-logo-size">90px</span></label><input type="range" id="ctrl-logo-size" min="40" max="160" value="90"></div>
        <button class="config-reset" id="btn-save" style="background:#3b82f6; color:white;">Guardar cambios</button>
        <button class="config-reset" id="btn-reset">Restaurar valores por defecto</button>
        <p id="save-confirm" style="text-align:center; color:#1DB954; font-size:0.85rem; height:16px; margin:0;"></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const isKraken = params.get('kraken') === '1';
        const CONFIG_KEY = 'kraken_display_settings';

        const DEFAULT_SETTINGS = {
            albumSize: 45, albumRadius: 18, elementGap: 6, titleSize: 16, artistSize: 11,
            bgBlur: 45, bgBrightness: 40, showLogo: true, logoSize: 90        
        };

        function loadSettings() {
            try {
                const raw = localStorage.getItem(CONFIG_KEY);
                return raw ? { ...DEFAULT_SETTINGS, ...JSON.parse(raw) } : { ...DEFAULT_SETTINGS };
            } catch (e) { return { ...DEFAULT_SETTINGS }; }
        }

        function saveSettings(settings) { localStorage.setItem(CONFIG_KEY, JSON.stringify(settings)); }

        function applySettings(settings) {
            const root = document.documentElement.style;
            root.setProperty('--album-size', settings.albumSize + '%');
            root.setProperty('--album-radius', settings.albumRadius + 'px');
            root.setProperty('--element-gap', settings.elementGap + '%');
            root.setProperty('--title-size', (settings.titleSize / 10) + 'rem');
            root.setProperty('--artist-size', (settings.artistSize / 10) + 'rem');
            root.setProperty('--bg-blur', settings.bgBlur + 'px');
            root.setProperty('--bg-brightness', (settings.bgBrightness / 100));
            root.setProperty('--logo-display', settings.showLogo ? 'block' : 'none');
            root.setProperty('--logo-size', settings.logoSize + 'px');
        }

        // --- SISTEMA INTELIGENTE DE TEXTO (ENCOGER Y SCROLL ÁGIL) ---
        function autoFitAndScroll() {
            const titleEl = document.getElementById('title');
            const artistEl = document.getElementById('artist');
            if (!titleEl || !artistEl) return;

            const settings = loadSettings();

            function processText(el, requestedSize) {
                el.classList.remove('scrolling-text');
                el.style.transform = 'none';
                el.style.fontSize = requestedSize + 'rem';
                
                let currentSize = requestedSize;
                const minSize = requestedSize * 0.85; 
                
                while (el.scrollWidth > el.parentElement.clientWidth && currentSize > minSize) {
                    currentSize -= 0.1;
                    el.style.fontSize = currentSize + 'rem';
                }

                const parentWidth = el.parentElement.clientWidth;
                const textWidth = el.scrollWidth;

                if (textWidth > parentWidth) {
                    const scrollDist = parentWidth - textWidth - 5; 
                    el.style.setProperty('--scroll-dist', scrollDist + 'px');
                    
                    const duration = 1.2 + (Math.abs(scrollDist) / 50);
                    el.style.setProperty('--scroll-duration', duration + 's');
                    
                    el.classList.add('scrolling-text');
                }
            }

            setTimeout(() => {
                processText(titleEl, settings.titleSize / 10);
                processText(artistEl, settings.artistSize / 10);
            }, 50);
        }

        if (isKraken) {
            document.getElementById('config-screen').style.display = 'none';
            document.getElementById('display-content').style.display = 'flex';

            applySettings(loadSettings());

            window.addEventListener('storage', (event) => {
                if (event.key === CONFIG_KEY) {
                    applySettings(loadSettings());
                    autoFitAndScroll();
                }
            });

            const TOKEN_WORKER_URL = 'https://spotify-token.enriqueblancolucio.workers.dev/';
            let accessToken = null;
            let tokenExpiresAt = 0;
            let activeLayer = 'a';
            let currentAlbumUrl = '';
            const titleEl = document.getElementById('title');
            const artistEl = document.getElementById('artist');

            function updateImagesSmoothly(newUrl) {
                if (newUrl === currentAlbumUrl || !newUrl) return;
                const preloader = new Image();
                preloader.src = newUrl;
                preloader.onload = () => {
                    const nextLayer = activeLayer === 'a' ? 'b' : 'a';
                    document.getElementById('album-art-' + nextLayer).style.backgroundImage = `url('${newUrl}')`;
                    document.getElementById('bg-blur-' + nextLayer).style.backgroundImage = `url('${newUrl}')`;
                    document.getElementById('album-art-' + nextLayer).classList.add('active');
                    document.getElementById('bg-blur-' + nextLayer).classList.add('active');
                    document.getElementById('album-art-' + activeLayer).classList.remove('active');
                    document.getElementById('bg-blur-' + activeLayer).classList.remove('active');
                    activeLayer = nextLayer;
                    currentAlbumUrl = newUrl;
                };
            }

            async function refreshAccessToken() {
                try {
                    const response = await fetch(TOKEN_WORKER_URL);
                    const data = await response.json();
                    if (data.access_token) {
                        accessToken = data.access_token;
                        tokenExpiresAt = Date.now() + (data.expires_in - 60) * 1000;
                    }
                } catch (error) { console.log(error); }
            }

            async function ensureValidToken() {
                if (!accessToken || Date.now() >= tokenExpiresAt) await refreshAccessToken();
            }

            async function getCurrentlyPlaying() {
                try {
                    await ensureValidToken();
                    if (!accessToken) return;

                    const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });

                    if (response.status === 204) return;
                    if (response.status === 401) { accessToken = null; return; }

                    const data = await response.json();

                    if (data && data.item) {
                        const songTitle = data.item.name;
                        const artistName = data.item.artists.map(a => a.name).join(', ');
                        const albumImage = data.item.album.images[0].url;

                        if (titleEl.innerText !== songTitle) {
                            titleEl.innerText = songTitle;
                            artistEl.innerText = artistName;
                            updateImagesSmoothly(albumImage); 
                            autoFitAndScroll(); 
                        }
                    }
                } catch (error) { console.log(error); }
            }

            getCurrentlyPlaying();
            setInterval(getCurrentlyPlaying, 3000);

        } else {
            // Lógica Menú de Ajustes
            document.getElementById('display-content').style.display = 'none';
            document.getElementById('config-screen').style.display = 'flex';
            document.getElementById('bg-blur-a').style.display = 'none';
            document.getElementById('bg-blur-b').style.display = 'none';

            const settings = loadSettings();
            const controls = {
                albumSize: document.getElementById('ctrl-album-size'),
                albumRadius: document.getElementById('ctrl-album-radius'),
                elementGap: document.getElementById('ctrl-element-gap'),
                titleSize: document.getElementById('ctrl-title-size'),
                artistSize: document.getElementById('ctrl-artist-size'),
                bgBlur: document.getElementById('ctrl-bg-blur'),
                bgBrightness: document.getElementById('ctrl-bg-brightness'),
                showLogo: document.getElementById('ctrl-logo'),
                logoSize: document.getElementById('ctrl-logo-size')
            };

            const labels = {
                albumSize: document.getElementById('val-album-size'),
                albumRadius: document.getElementById('val-album-radius'),
                elementGap: document.getElementById('val-element-gap'),
                titleSize: document.getElementById('val-title-size'),
                artistSize: document.getElementById('val-artist-size'),
                bgBlur: document.getElementById('val-bg-blur'),
                bgBrightness: document.getElementById('val-bg-brightness'),
                logoSize: document.getElementById('val-logo-size')
            };

            function refreshLabels(s) {
                labels.albumSize.innerText = s.albumSize + '%';
                labels.albumRadius.innerText = s.albumRadius + 'px';
                labels.elementGap.innerText = s.elementGap + '%';
                labels.titleSize.innerText = (s.titleSize / 10) + 'rem';
                labels.artistSize.innerText = (s.artistSize / 10) + 'rem';
                labels.bgBlur.innerText = s.bgBlur + 'px';
                labels.bgBrightness.innerText = s.bgBrightness + '%';
                labels.logoSize.innerText = s.logoSize + 'px';
            }

            controls.albumSize.value = settings.albumSize;
            controls.albumRadius.value = settings.albumRadius;
            controls.elementGap.value = settings.elementGap;
            controls.titleSize.value = settings.titleSize;
            controls.artistSize.value = settings.artistSize;
            controls.bgBlur.value = settings.bgBlur;
            controls.bgBrightness.value = settings.bgBrightness;
            controls.showLogo.checked = settings.showLogo;
            controls.logoSize.value = settings.logoSize;
            refreshLabels(settings);

            function handleLiveChange() {
                const updated = {
                    albumSize: Number(controls.albumSize.value),
                    albumRadius: Number(controls.albumRadius.value),
                    elementGap: Number(controls.elementGap.value),
                    titleSize: Number(controls.titleSize.value),
                    artistSize: Number(controls.artistSize.value),
                    bgBlur: Number(controls.bgBlur.value),
                    bgBrightness: Number(controls.bgBrightness.value),
                    showLogo: controls.showLogo.checked,
                    logoSize: Number(controls.logoSize.value)
                };
                refreshLabels(updated);
                saveSettings(updated);
            }

            Object.values(controls).forEach(ctrl => ctrl.addEventListener('input', handleLiveChange));

            const saveConfirm = document.getElementById('save-confirm');
            document.getElementById('btn-save').addEventListener('click', () => {
                handleLiveChange();
                saveConfirm.innerText = '✓ Guardado correctamente';
                setTimeout(() => { saveConfirm.innerText = ''; }, 2000);
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                controls.albumSize.value = DEFAULT_SETTINGS.albumSize;
                controls.albumRadius.value = DEFAULT_SETTINGS.albumRadius;
                controls.elementGap.value = DEFAULT_SETTINGS.elementGap;
                controls.titleSize.value = DEFAULT_SETTINGS.titleSize;
                controls.artistSize.value = DEFAULT_SETTINGS.artistSize;
                controls.bgBlur.value = DEFAULT_SETTINGS.bgBlur;
                controls.bgBrightness.value = DEFAULT_SETTINGS.bgBrightness;
                controls.showLogo.checked = DEFAULT_SETTINGS.showLogo;
                controls.logoSize.value = DEFAULT_SETTINGS.logoSize;
                handleLiveChange();
            });
        }
    </script>
</body>
</html>
